openapi: '3.1.0'
info:
  title: AI/ML Inference Service API
  version: '1.0.0'
  description: Internal Python FastAPI ML inference service contract (Spring Boot → ML service)
paths:
  /ml/v1/growth-stage:
    post:
      summary: Growth Stage Prediction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrowthStageRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowthStageResponse'
  /ml/v1/risk-score:
    post:
      summary: Business Risk Score Prediction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskScoreRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskScoreResponse'
  /ml/v1/simulation:
    post:
      summary: Business Simulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResponse'
  /ml/v1/policy-match:
    post:
      summary: Semantic Policy Match (SPEC-CMS-AI-002)
      description: >-
        기업 프로필(+선택 자연어 질의)과 후보 정책 ID 풀에 대해 정책별 시맨틱
        유사도 점수(0~1)와 매칭 근거를 반환한다. company_profile에는 PII를 포함하지
        않는다(ksic_code/employee_count/growth_stage/region_code/annual_revenue 한정).
        Spring Boot가 SPEC-CMS-007 활성 정책 풀에서 candidate_policy_ids를 추출하여 전달한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyMatchRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyMatchResponse'
  /ml/v1/embed:
    post:
      summary: Sentence Embedding (SPEC-CMS-AI-003)
      description: >-
        질문 텍스트를 384차원 임베딩 벡터로 변환한다. 페이로드에는 질문
        텍스트(text)만 포함되며 company_id/회원ID/세션 평문 등 PII는 절대
        포함하지 않는다(AC-RAG-005).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedResponse'
  /ml/v1/rag:
    post:
      summary: Retrieval-Augmented Generation (SPEC-CMS-AI-003)
      description: >-
        질문과 검색된 상위 K개 정책 컨텍스트로 생성형 답변을 반환한다.
        페이로드에는 질문(question)과 정책 컨텍스트(contexts)만 포함되며
        사용자 식별정보는 포함하지 않는다(AC-RAG-005).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagResponse'
  /ml/v1/tag-recommend:
    post:
      summary: 태그 추천 (SPEC-CMS-AI-004)
      operationId: tagRecommend
      description: >-
        게시글·Q&A 본문 텍스트로 추천 태그 목록과 신뢰도 점수를 반환한다.
        페이로드에는 본문(content)과 기존 선택 태그(existing_tags)만 포함되며
        작성자 식별정보는 포함하지 않는다(AC-AI-TAG-007/NFR-003).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRecommendRequest'
      responses:
        '200':
          description: 추천 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagRecommendResponse'
  /ml/v1/health:
    get:
      summary: ML Service Health Check
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlHealthResponse'
components:
  schemas:
    GrowthStageRequest:
      type: object
      required: [ksicCode, capitalAmount, foundingYear]
      properties:
        ksicCode: {type: string, maxLength: 5}
        capitalAmount: {type: integer, format: int64}
        foundingYear: {type: integer}
        revenueAmount: {type: integer, format: int64}
    GrowthStageResponse:
      type: object
      properties:
        stage: {type: string, enum: [SEED, STARTUP, GROWTH, EXPANSION, MATURITY]}
        entryProbabilities:
          type: object
          additionalProperties: {type: number, format: double}
        confidence: {type: number, format: double}
        modelVersion: {type: string}
    RiskScoreRequest:
      type: object
      required: [ksicCode, capitalAmount, foundingYear]
      properties:
        ksicCode: {type: string}
        capitalAmount: {type: integer, format: int64}
        foundingYear: {type: integer}
        revenueAmount: {type: integer, format: int64}
    RiskScoreResponse:
      type: object
      properties:
        defaultProbability: {type: number, format: double}
        riskGrade: {type: string, enum: [GREEN, YELLOW, ORANGE, RED]}
        topFactors:
          type: array
          maxItems: 3
          items:
            type: object
            properties:
              name: {type: string}
              contribution: {type: number, format: double}
        modelVersion: {type: string}
    SimulationRequest:
      type: object
      required: [ksicCode, capitalAmount, foundingYear]
      properties:
        ksicCode: {type: string}
        capitalAmount: {type: integer, format: int64}
        foundingYear: {type: integer}
        revenueAmount: {type: integer, format: int64}
    SimulationResponse:
      type: object
      properties:
        projection:
          type: array
          items:
            type: object
            properties:
              year: {type: integer}
              stage: {type: string}
              entryProbabilities:
                type: object
                additionalProperties: {type: number, format: double}
        modelVersion: {type: string}
    PolicyMatchRequest:
      type: object
      required: [company_profile, candidate_policy_ids, top_k]
      properties:
        company_profile:
          type: object
          description: PII 제외 — ksic_code/employee_count/growth_stage/region_code/annual_revenue 한정
          properties:
            ksic_code: {type: string}
            employee_count: {type: integer}
            growth_stage: {type: string}
            region_code: {type: string}
            annual_revenue: {type: integer, format: int64}
        query_text: {type: string, nullable: true, maxLength: 500}
        candidate_policy_ids:
          type: array
          items: {type: integer, format: int64}
        top_k: {type: integer, minimum: 1, maximum: 50}
    PolicyMatchResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            type: object
            properties:
              policy_id: {type: integer, format: int64}
              semantic_score: {type: number, format: double, minimum: 0, maximum: 1}
              explanation:
                type: object
                properties:
                  matched_terms:
                    type: array
                    items: {type: string}
                  rationale: {type: string}
        model_name: {type: string}
        model_version: {type: string}
    MlHealthResponse:
      type: object
      properties:
        status: {type: string}
        loadedModels:
          type: array
          items: {type: string}
    EmbedRequest:
      type: object
      required: [text]
      properties:
        text: {type: string, description: '정규화된 질문 텍스트 (PII 미포함)'}
    EmbedResponse:
      type: object
      properties:
        vector:
          type: array
          minItems: 384
          maxItems: 384
          items: {type: number, format: float}
    RagRequest:
      type: object
      required: [question, contexts]
      properties:
        question: {type: string, description: '정규화된 질문 텍스트 (PII 미포함)'}
        contexts:
          type: array
          items:
            type: object
            properties:
              id: {type: integer, format: int64}
              title: {type: string}
              content: {type: string}
    RagResponse:
      type: object
      properties:
        answer: {type: string}
        sources:
          type: array
          items:
            type: object
            properties:
              id: {type: integer, format: int64}
              relevance: {type: number, format: double, minimum: 0, maximum: 1}
        quality_score: {type: integer, minimum: 0, maximum: 100, nullable: true}
    TagRecommendRequest:
      type: object
      required: [content]
      properties:
        content: {type: string, description: '추천 입력 본문 텍스트 (PII 미포함)'}
        existing_tags:
          type: array
          items: {type: string}
        top_k: {type: integer, default: 5}
    TagRecommendResponse:
      type: object
      properties:
        recommended_tags:
          type: array
          items: {type: string}
        scores:
          type: object
          additionalProperties: {type: number, format: double}
        model_version: {type: string, nullable: true}
