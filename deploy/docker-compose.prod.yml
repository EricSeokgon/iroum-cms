# iroum-cms 운영 배포용 Docker Compose
# 사용: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
#
# 서비스 구성:
#   postgres   — PostgreSQL 16 (영구 볼륨)
#   redis      — Redis 7 (세션 캐시, 선택)
#   backend    — Spring Boot (prod 프로파일)
#   admin-fe   — 관리자 SPA (Vue 3)
#   public-fe  — 공공 SPA (Vue 3)
#   nginx      — 리버스 프록시 + 정적 자산

version: "3.9"

services:
  # ──────────────────────────────────────────
  # PostgreSQL 16 — 운영 데이터베이스
  # ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: iroum-postgres
    environment:
      POSTGRES_DB: iroum_cms
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d iroum_cms"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - iroum-net
    restart: unless-stopped
    # 외부 포트 미노출 (내부 네트워크만 접근)

  # ──────────────────────────────────────────
  # Redis 7 — 세션/캐시 (선택)
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: iroum-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - iroum-net
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Backend — Spring Boot 3.5.9 (prod 프로파일)
  # ──────────────────────────────────────────
  backend:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.backend
    container_name: iroum-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/iroum_cms
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_LOG_IP_SALT: ${ACCESS_LOG_IP_SALT}
      AES_KEY: ${AES_KEY}
      # ML 추론 서비스 (내부 네트워크). .env 미지정 시 컨테이너명 기본값 사용
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8000}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - iroum-net
    restart: unless-stopped
    # 외부 포트 미노출 (nginx 경유)

  # ──────────────────────────────────────────
  # ML Service — Python FastAPI 추론 서비스
  # 규칙 기반 예측 + sentence-transformers 임베딩
  # SPEC-CMS-ML-SERVICE-001
  # ──────────────────────────────────────────
  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    image: iroum-cms-ml-service:latest
    container_name: iroum-ml-service
    environment:
      - LOG_LEVEL=INFO
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:8000/ml/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - iroum-net
    restart: unless-stopped
    # 외부 포트 미노출 (내부 네트워크만 접근)

  # ──────────────────────────────────────────
  # Admin SPA — Vue 3 관리자 백오피스
  # ──────────────────────────────────────────
  admin-fe:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.frontend
      args:
        APP: admin
        VITE_API_BASE: /api/v1
    container_name: iroum-admin-fe
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - iroum-net
    restart: unless-stopped
    # 외부 포트 미노출 (nginx 경유)

  # ──────────────────────────────────────────
  # Public SPA — Vue 3 공공 웹사이트
  # ──────────────────────────────────────────
  public-fe:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.frontend
      args:
        APP: public
        VITE_API_BASE: /api/v1
    container_name: iroum-public-fe
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - iroum-net
    restart: unless-stopped

  # ──────────────────────────────────────────
  # nginx — 리버스 프록시 / 도메인 라우팅
  # 포트 80 → admin.iroum.co.kr 또는 www.iroum.co.kr
  # ──────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: iroum-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/conf.d/proxy.conf:ro
    ports:
      - "80:80"
      # HTTPS는 별도 인증서 볼륨 마운트 후 443 추가
      # - "443:443"
    depends_on:
      backend:
        condition: service_healthy
      admin-fe:
        condition: service_healthy
      public-fe:
        condition: service_healthy
    networks:
      - iroum-net
    restart: unless-stopped

volumes:
  postgres_data:
    name: iroum_cms_postgres_data
  redis_data:
    name: iroum_cms_redis_data

networks:
  iroum-net:
    name: iroum-cms-network
    driver: bridge
