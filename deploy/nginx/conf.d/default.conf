# iroum-cms nginx 라우팅 설정
#
# 라우팅 규칙:
#   /api/    → backend:8080 (Spring Boot)
#   /admin/  → admin-fe:80 (관리자 SPA)
#   /        → public-fe:80 (공공 웹사이트 SPA)

server {
    listen 80 default_server;
    server_name _;

    # ─── 보안 헤더 ───
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;
    # HSTS는 HTTPS 환경에서만 활성화 (운영 nginx에서 주석 해제)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 요청 본문 최대 크기 (첨부파일 업로드 고려)
    client_max_body_size 50m;

    # ─── API 라우팅 → Spring Boot 백엔드 ───
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 타임아웃 (긴 쿼리 대응)
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # 에러 처리
        proxy_intercept_errors off;
    }

    # Spring Boot Actuator — 내부망만 허용 (운영 시 IP 제한 필요)
    location /actuator/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 운영 환경에서 아래 주석 해제하여 내부망 제한
        # allow 10.0.0.0/8;
        # deny all;
    }

    # ─── 관리자 SPA → admin-fe:80 ───
    location /admin/ {
        proxy_pass http://admin_fe/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── 공공 웹사이트 SPA (기본 라우트) → public-fe:80 ───
    location / {
        proxy_pass http://public_fe;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
