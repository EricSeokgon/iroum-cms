# iroum-cms SPA nginx 설정
# Dockerfile.frontend Stage 2에서 /etc/nginx/conf.d/default.conf로 복사됨
# Vue Router history 모드 지원 (SPA 폴백)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── SPA 폴백 라우팅 ───
    # Vue Router history 모드: 알 수 없는 경로는 index.html로 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── 정적 자산 캐싱 (Vite 빌드 해시 파일명 기준) ───
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # index.html — 캐시 비활성화 (배포 후 즉시 반영)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        expires 0;
    }

    # gzip 압축 미리 생성된 파일 서빙
    gzip_static on;
}
