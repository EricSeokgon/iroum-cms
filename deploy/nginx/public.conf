# iroum-cms Public SPA — nginx server block
# 역할: 공공 웹사이트 SPA 서빙 + API 프록시 + Gzip
#
# 적용 대상: www.iroum.co.kr / iroum.co.kr (운영)
# Vue Router history 모드: SPA 폴백 (try_files → /index.html)

server {
    listen 80 default_server;
    server_name iroum.co.kr www.iroum.co.kr _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── 보안 헤더 ───
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS — HTTPS 환경에서 주석 해제
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 요청 본문 최대 크기
    client_max_body_size 20m;

    # ─── Gzip 압축 ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # ─── SPA 폴백 라우팅 ───
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── index.html — 캐시 비활성화 (배포 후 즉시 반영) ───
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma no-cache;
        expires 0;
    }

    # ─── Vite 해시 정적 자산 — 장기 캐싱 ───
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ─── API 프록시 → backend:8080 ───
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_intercept_errors off;
    }

    # ─── Actuator health — 로드밸런서 허용 ───
    location = /actuator/health {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # ─── 그 외 Actuator — 외부 노출 차단 ───
    location /actuator/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # gzip 사전 압축 파일 서빙
    gzip_static on;
}
