# iroum-cms Admin SPA — nginx server block
# 역할: 관리자 백오피스 SPA 서빙 + API 프록시 + Actuator 보호
#
# 적용 대상: admin.iroum.co.kr (운영) / localhost:5173 (개발 포워드 포트)
# Vue Router history 모드: SPA 폴백 (try_files → /index.html)

server {
    listen 80;
    server_name admin.iroum.co.kr;

    root /usr/share/nginx/html;
    index index.html;

    # ─── 보안 헤더 ───
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS — HTTPS 환경에서 주석 해제
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 요청 본문 최대 크기 (첨부파일 업로드 고려)
    client_max_body_size 50m;

    # ─── SPA 폴백 라우팅 ───
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── index.html — 캐시 비활성화 (배포 후 즉시 반영) ───
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma no-cache;
        expires 0;
    }

    # ─── Vite 해시 정적 자산 — 장기 캐싱 ───
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ─── API 프록시 → backend:8080 ───
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_intercept_errors off;
    }

    # ─── Actuator health — 공개 (로드밸런서 헬스체크 허용) ───
    location = /actuator/health {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # ─── Actuator Prometheus — 내부망/모니터링 IP만 허용 ───
    location = /actuator/prometheus {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # 운영 환경: ADMIN_IP_WHITELIST 대역으로 제한
        # 아래 allow/deny 블록은 .env ADMIN_IP_WHITELIST 기반으로 운영팀이 적용
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # deny all;
        access_log off;
    }

    # ─── 그 외 Actuator 엔드포인트 — 내부망만 허용 ───
    location /actuator/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        access_log off;
    }

    # gzip 사전 압축 파일 서빙
    gzip_static on;
}
