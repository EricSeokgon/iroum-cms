name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────
  # 백엔드 정적 분석 (Gradle checkstyle / spotbugs)
  # ──────────────────────────────────────────
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Gradle check (compileOnly)
        working-directory: backend
        run: ./gradlew compileJava compileTestJava --no-daemon

  # ──────────────────────────────────────────
  # 프론트엔드 ESLint (admin / public 병렬)
  # ──────────────────────────────────────────
  frontend-lint:
    name: Frontend ESLint (${{ matrix.app }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [admin, public, shared]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: "9.0.0"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      - name: ESLint ${{ matrix.app }}
        working-directory: frontend
        run: pnpm -F @iroum-cms/${{ matrix.app }} lint
