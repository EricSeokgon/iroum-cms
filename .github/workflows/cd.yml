name: CD

# main 브랜치 push 후 CI가 통과하면 운영 서버에 자동 배포
# 트리거: ci.yml 의 docker-build job 성공 이후
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

# 동시 배포 방지 (순서 보장)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    # CI 워크플로가 성공한 경우에만 실행
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ──────────────────────────────────────────
      # 운영 서버 SSH 접속 후 배포 실행
      # 필요 Secrets (Settings → Secrets → Actions):
      #   DEPLOY_SSH_KEY  — RSA/ED25519 개인키 (운영 서버 authorized_keys 등록 필요)
      #   DEPLOY_HOST     — 운영 서버 IP 또는 도메인 (예: 10.0.0.10)
      #   DEPLOY_USER     — SSH 접속 유저 (예: deploy)
      #   DEPLOY_PATH     — 배포 경로 (예: /opt/iroum-cms)
      #   DEPLOY_ENV      — deploy/.env 파일 전체 내용 (멀티라인 Secret)
      # ──────────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            # 배포 디렉토리로 이동
            cd "${{ secrets.DEPLOY_PATH }}"

            # 최신 코드 pull
            git pull origin main

            # 환경변수 파일 복원 (Secret에서 주입)
            # 참고: 최초 배포 시 서버에서 직접 deploy/.env 생성 필요
            # 이후 자동 배포에서는 Secret DEPLOY_ENV 활용 가능

            # 이미지 빌드 (레이어 캐시 활용)
            docker compose -f deploy/docker-compose.prod.yml \
              --env-file deploy/.env \
              build --pull

            # 백엔드 롤링 업데이트 (무중단: nginx가 upstream으로 분산)
            docker compose -f deploy/docker-compose.prod.yml \
              --env-file deploy/.env \
              up -d --no-deps --remove-orphans backend

            # 프론트엔드 업데이트
            docker compose -f deploy/docker-compose.prod.yml \
              --env-file deploy/.env \
              up -d --no-deps --remove-orphans admin-fe public-fe

            # nginx 설정 리로드 (무중단)
            docker compose -f deploy/docker-compose.prod.yml \
              exec -T nginx nginx -s reload

            # 사용하지 않는 이미지 정리 (디스크 관리)
            docker image prune -f

      # ──────────────────────────────────────────
      # 배포 결과 헬스 확인 (외부 접근 가능한 경우)
      # DEPLOY_HEALTH_URL Secret 미설정 시 이 단계는 스킵
      # ──────────────────────────────────────────
      - name: Health Check
        if: ${{ secrets.DEPLOY_HEALTH_URL != '' }}
        run: |
          echo "헬스 체크: ${{ secrets.DEPLOY_HEALTH_URL }}/actuator/health"
          # 최대 60초 대기 (Spring Boot 기동 시간 고려)
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "${{ secrets.DEPLOY_HEALTH_URL }}/actuator/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "헬스 체크 성공 (시도 $i)"
              exit 0
            fi
            echo "시도 $i: HTTP $STATUS — 5초 후 재시도..."
            sleep 5
          done
          echo "헬스 체크 실패 — 배포 확인 필요"
          exit 1

      # ──────────────────────────────────────────
      # 배포 완료 알림 (선택 — Slack 미사용 시 스킵)
      # SLACK_WEBHOOK_URL Secret 설정 시 활성화
      # ──────────────────────────────────────────
      - name: Notify Deployment Result
        if: always() && ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            iroum-cms 배포 ${{ job.status == 'success' && '성공' || '실패' }}
            커밋: ${{ github.sha }}
            브랜치: ${{ github.ref_name }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
