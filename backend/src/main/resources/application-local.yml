# 로컬 개발 환경 설정
# docker-compose의 postgres:16-alpine 서비스와 연동
spring:
  mail:
    # 로컬 개발: MailHog (docker-compose mailhog 서비스)
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
        debug: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iroum_cms_local}
    username: ${DB_USERNAME:iroum_cms}
    password: ${DB_PASSWORD:iroum_cms_dev_pwd}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 900000
      pool-name: HikariPool-local

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  cloud:
    vault:
      enabled: false

logging:
  level:
    root: DEBUG
    kr.co.ircp.cms: DEBUG
    org.springframework.security: DEBUG
    org.mybatis.spring: DEBUG
    org.flywaydb: DEBUG

springdoc:
  swagger-ui:
    enabled: true

# 로컬 개발 전용 시크릿 — 운영 환경에서는 반드시 환경변수로 재정의
# SPEC-CMS-SECURITY-JWT: local 프로파일에서만 사용. prod에서는 환경변수 필수.
iroum:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-256-bits-minimum-do-not-use-in-prod}
  media:
    signed-url-secret: ${MEDIA_SIGNED_URL_SECRET:local-dev-only-media-secret-do-not-use-in-prod}
  board:
    attachment:
      hmac-secret: ${ATTACHMENT_HMAC_SECRET:local-dev-only-hmac-secret-do-not-use-in-prod}

# 로컬 개발 전용 PII 키 — 운영 환경에서는 환경변수 또는 KMS로 교체할 것
pii:
  keyvault:
    provider: local-env
    active-version: 1
    keys:
      v1: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    hmac-key: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=

# 로컬 환경에서 외부 서비스 미기동 시 actuator health DOWN 방지
# 운영에서는 application.yml 기본값(true) 유지
management:
  health:
    mail:
      enabled: false

resilience4j:
  circuitbreaker:
    instances:
      ml-service:
        registerHealthIndicator: false
