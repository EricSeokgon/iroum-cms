# 운영 환경 설정
# 모든 민감 정보는 환경변수로 주입 — 하드코딩 금지
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariPool-prod

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true

logging:
  level:
    root: INFO
    kr.co.ircp.cms: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
    com.zaxxer.hikari: WARN
  # logback-spring.xml의 prod 프로파일이 JSON 인코더를 처리하므로 pattern 불필요
  # (LogstashEncoder가 @timestamp, @version, MDC 필드를 자동 포함)

# 운영에서 Swagger UI 비활성화 (nginx로 차단하더라도 이중 보호)
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  info:
    build:
      enabled: true
  metrics:
    tags:
      application: iroum-cms
