# 운영 환경 설정
# 모든 민감 정보는 환경변수로 주입 — 하드코딩 금지
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariPool-prod

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true
    # V57/V58 이메일 템플릿 시드의 Thymeleaf ${var} 리터럴 보존 (SPEC-CMS-USER-APPROVAL-001).
    placeholder-replacement: false

logging:
  level:
    root: INFO
    kr.co.ircp.cms: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
    com.zaxxer.hikari: WARN
  # logback-spring.xml의 prod 프로파일이 JSON 인코더를 처리하므로 pattern 불필요
  # (LogstashEncoder가 @timestamp, @version, MDC 필드를 자동 포함)

# 운영에서 Swagger UI 비활성화 (nginx로 차단하더라도 이중 보호)
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  info:
    build:
      enabled: true
  metrics:
    tags:
      application: iroum-cms

# PII 암호화 키 관리 — AWS KMS (SPEC-CMS-SECURITY-PII-KMS-001)
# 운영 환경에서는 반드시 AWS KMS 공급자를 사용한다. (local-env 금지)
# 환경변수 주입 필수:
#   PII_KMS_KEY_ID       : AWS KMS CMK ARN (예: arn:aws:kms:ap-northeast-2:123456789012:key/...)
#   PII_KMS_REGION       : AWS 리전 (예: ap-northeast-2)
#   PII_KMS_ACTIVE_VERSION: 활성 DEK 버전 (예: 1)
#   PII_KMS_ENC_DEK_V1   : KMS로 암호화된 AES-256 DEK v1 (base64)
#   PII_KMS_ENC_HMAC     : KMS로 암호화된 HMAC-SHA256 키 (base64)
#
# 키 생성 절차 (최초 1회):
#   1. AWS KMS에서 CMK 생성 (대칭 암호화 키)
#   2. 32-byte 난수 DEK 생성 후 aws kms encrypt --key-id <CMK_ARN> --plaintext <DEK_BASE64> 실행
#   3. 반환된 CiphertextBlob을 base64 인코딩하여 PII_KMS_ENC_DEK_V1 환경변수에 설정
#   4. HMAC 키도 동일한 방식으로 PII_KMS_ENC_HMAC 환경변수에 설정
pii:
  keyvault:
    provider: aws-kms
    aws-kms:
      key-id: ${PII_KMS_KEY_ID}
      region: ${PII_KMS_REGION:ap-northeast-2}
      active-version: ${PII_KMS_ACTIVE_VERSION:1}
      encrypted-keys:
        dek-v1: ${PII_KMS_ENC_DEK_V1}
        hmac: ${PII_KMS_ENC_HMAC}
