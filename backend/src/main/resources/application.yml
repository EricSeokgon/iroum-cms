spring:
  application:
    name: iroum-cms-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  mvc:
    contentnegotiation:
      favor-parameter: false

  # MyBatis는 JPA를 사용하지 않으므로 open-in-view 경고 억제
  jpa:
    open-in-view: false

server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: framework
  # 요청 압축 (운영 성능 향상)
  compression:
    enabled: true
    min-response-size: 1024

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: iroum-cms-backend
    version: 0.1.0-SNAPSHOT
    description: iroum CMS API Server (egovFrame 5.0 + Spring Boot 3.2)

# springdoc-openapi 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json;charset=UTF-8

# MyBatis 공통 설정 (DB 연결 설정은 프로파일별 yml에서)
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    cache-enabled: false
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: kr.co.ircp.cms.domain
  # REQ-AUTH-018 — JSONB ↔ List<String> 변환 TypeHandler 등록
  type-handlers-package: kr.co.ircp.cms.domain.auth.repository.typehandler

# iroum CMS JWT 설정 (SPEC-CMS-002 REQ-AUTH-001/002)
iroum:
  jwt:
    # 운영 환경에서 반드시 JWT_SECRET 환경변수로 재정의 (최소 256비트)
    secret: ${JWT_SECRET:changeme-256-bits-min-replace-in-prod-aaaaaaaaaaaaaaaaaaaaa}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    issuer: iroum-cms

logging:
  level:
    root: INFO
    kr.co.ircp.cms: DEBUG
    org.springframework.security: INFO
    org.mybatis: INFO
    org.flywaydb: INFO
