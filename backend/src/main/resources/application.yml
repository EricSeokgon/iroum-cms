spring:
  application:
    name: iroum-cms-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  mvc:
    contentnegotiation:
      favor-parameter: false

  # 파일 업로드 크기 제한 — Spring 기본값(1MB)을 미디어 서비스 최대값과 맞춤
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

  # MyBatis는 JPA를 사용하지 않으므로 open-in-view 경고 억제
  jpa:
    open-in-view: false

server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: framework
  # 요청 압축 (운영 성능 향상)
  compression:
    enabled: true
    min-response-size: 1024

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,backupStatus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    backupStatus:
      enabled: true
  info:
    # SPEC-CMS-SECURITY-LOW-17 — 환경 변수(시스템 메타데이터) 노출 방지.
    # /actuator/info 응답에 env 정보가 포함되지 않도록 비활성화. 로컬 디버깅 시에만 application-local.yml 에서 재정의.
    env:
      enabled: false

info:
  app:
    name: iroum-cms-backend
    version: 0.1.0-SNAPSHOT
    description: iroum CMS API Server (egovFrame 5.0 + Spring Boot 3.2)

# springdoc-openapi 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json;charset=UTF-8

# MyBatis 공통 설정 (DB 연결 설정은 프로파일별 yml에서)
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    cache-enabled: false
  mapper-locations:
    - classpath*:mapper/**/*.xml
    - classpath*:mybatis/mapper/**/*.xml
  type-aliases-package: kr.co.ircp.cms.domain
  # REQ-AUTH-018 — JSONB ↔ List<String> 변환 TypeHandler 등록
  # REQ-BOARD-012-D-4 — UUID[] 변환 TypeHandler 등록 (publication_zip_archive)
  type-handlers-package: kr.co.ircp.cms.domain.auth.repository.typehandler,kr.co.ircp.cms.domain.board.repository

# iroum CMS JWT 설정 (SPEC-CMS-002 REQ-AUTH-001/002)
# SPEC-CMS-SECURITY-JWT — 시크릿 기본값 제거: 환경변수 미설정 시 부팅 실패
iroum:
  # 미디어 라이브러리 설정 (REQ-MEDIA-001 ~ REQ-MEDIA-005)
  media:
    base-path: ${MEDIA_STORAGE_PATH:/tmp/iroum-cms/media}
    signed-url-secret: ${MEDIA_SIGNED_URL_SECRET:CHANGE_ME_IN_PRODUCTION}
    signed-url-ttl: PT15M
    max-size-mb: 200
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      - image/svg+xml
      - video/mp4
      - video/webm
      - video/quicktime
      - audio/mpeg
      - audio/ogg
      - audio/wav
      - application/pdf
      - text/plain
  jwt:
    # JWT_SECRET 환경변수 필수 (최소 256비트). 미설정 시 application context 부팅 실패.
    secret: ${JWT_SECRET}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    issuer: iroum-cms
  # 첨부파일 설정 (REQ-BOARD-004, REQ-BOARD-005)
  board:
    attachment:
      # 첨부파일 저장 기본 경로 (운영: S3 경로 또는 마운트 경로로 재정의)
      storage-path: ${ATTACHMENT_STORAGE_PATH:/tmp/iroum-cms/attachments}
      # 허용 MIME 타입 목록
      allowed-mime-types:
        - image/jpeg
        - image/png
        - image/gif
        - image/webp
        - application/pdf
        - application/msword
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.ms-excel
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - text/plain
      # 전역 최대 파일 크기 (KB) — 게시판별 maxAttachmentSizeKb로 추가 제한 가능
      global-max-size-kb: 51200
      # HMAC-SHA256 서명 키 (필수: ATTACHMENT_HMAC_SECRET 환경변수 미설정 시 부팅 실패)
      hmac-secret: ${ATTACHMENT_HMAC_SECRET}
      # 다운로드 URL TTL (초, 기본 900 = 15분)
      download-ttl-seconds: 900

# ─── SPEC-CMS-AI-001 — ML 추론 서비스 + AI 설정 ─────────────────────────────
# ML 서비스는 내부망 전용 (외부 노출 금지)
ml:
  service:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout:
      growth-stage-ms: 3000
      risk-score-ms: 500
      simulation-ms: 3000
      policy-match-ms: 3000
      tag-recommend-ms: 3000
      health-ms: 1000

ai:
  cache:
    growth-stage-ttl-hours: 1
  async:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 500
  risk:
    thresholds:
      green: 0.25
      yellow: 0.50
      orange: 0.75
  rate-limit:
    simulation-per-hour: 30
  # SPEC-CMS-AI-002 — 하이브리드 정책 매칭 (캐시 TTL·가중치·Top-K 경계)
  policy-match:
    cache-ttl-minutes: 30
    w-rule: 0.4
    w-semantic: 0.6
    top-k-default: 10
    top-k-max: 50

resilience4j:
  circuitbreaker:
    instances:
      ml-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        slowCallDurationThreshold: 5s
        slowCallRateThreshold: 50

logging:
  level:
    root: INFO
    # SPEC-CMS-SECURITY-MEDIUM-16 — 운영환경에서 DEBUG 로그 비활성 — PII 누설 방지.
    # 로컬 개발 시 application-local.yml 에서 DEBUG 로 재정의된다.
    kr.co.ircp.cms: INFO
    org.springframework.security: INFO
    org.mybatis: INFO
    org.flywaydb: INFO

# KMS 어댑터 설정 예시 (pii.keyvault.provider=aws-kms 활성화 시)
# pii:
#   keyvault:
#     provider: aws-kms
#     aws-kms:
#       key-id: arn:aws:kms:ap-northeast-2:123456789:key/your-cmk-id
#       region: ap-northeast-2
#       active-version: 1
#       endpoint-override: # LocalStack 사용 시: http://localhost:4566
#       encrypted-keys:
#         dek-v1: BASE64_KMS_ENCRYPTED_AES_KEY_V1
#         hmac: BASE64_KMS_ENCRYPTED_HMAC_KEY

# KOSHA OpenAPI 연동 (REQ-SAFETY-001-D-4)
# service-key 미설정 시 KoshaApiClient 빈이 비활성화됨 (로컬·테스트 안전 폴백)
# 운영: KOSHA_API_KEY 환경변수로 주입
kosha:
  api:
    base-url: http://apis.data.go.kr/B552015/OSHIS_SAFE_ACCIDENT
    service-key: ${KOSHA_API_KEY:}   # 빈 문자열이면 빈 비활성화
    page-size: 100
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
