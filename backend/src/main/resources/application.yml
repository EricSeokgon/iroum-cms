spring:
  application:
    name: iroum-cms-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  mvc:
    contentnegotiation:
      favor-parameter: false

  # MyBatis는 JPA를 사용하지 않으므로 open-in-view 경고 억제
  jpa:
    open-in-view: false

server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: framework
  # 요청 압축 (운영 성능 향상)
  compression:
    enabled: true
    min-response-size: 1024

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,backupStatus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    backupStatus:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: iroum-cms-backend
    version: 0.1.0-SNAPSHOT
    description: iroum CMS API Server (egovFrame 5.0 + Spring Boot 3.2)

# springdoc-openapi 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json;charset=UTF-8

# MyBatis 공통 설정 (DB 연결 설정은 프로파일별 yml에서)
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    cache-enabled: false
  mapper-locations:
    - classpath*:mapper/**/*.xml
    - classpath*:mybatis/mapper/**/*.xml
  type-aliases-package: kr.co.ircp.cms.domain
  # REQ-AUTH-018 — JSONB ↔ List<String> 변환 TypeHandler 등록
  # REQ-BOARD-012-D-4 — UUID[] 변환 TypeHandler 등록 (publication_zip_archive)
  type-handlers-package: kr.co.ircp.cms.domain.auth.repository.typehandler,kr.co.ircp.cms.domain.board.repository

# iroum CMS JWT 설정 (SPEC-CMS-002 REQ-AUTH-001/002)
iroum:
  jwt:
    # 운영 환경에서 반드시 JWT_SECRET 환경변수로 재정의 (최소 256비트)
    secret: ${JWT_SECRET:changeme-256-bits-min-replace-in-prod-aaaaaaaaaaaaaaaaaaaaa}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    issuer: iroum-cms
  # 첨부파일 설정 (REQ-BOARD-004, REQ-BOARD-005)
  board:
    attachment:
      # 첨부파일 저장 기본 경로 (운영: S3 경로 또는 마운트 경로로 재정의)
      storage-path: ${ATTACHMENT_STORAGE_PATH:/tmp/iroum-cms/attachments}
      # 허용 MIME 타입 목록
      allowed-mime-types:
        - image/jpeg
        - image/png
        - image/gif
        - image/webp
        - application/pdf
        - application/msword
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.ms-excel
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - text/plain
      # 전역 최대 파일 크기 (KB) — 게시판별 maxAttachmentSizeKb로 추가 제한 가능
      global-max-size-kb: 51200
      # HMAC-SHA256 서명 키 (운영: 환경변수 ATTACHMENT_HMAC_SECRET으로 반드시 재정의)
      hmac-secret: ${ATTACHMENT_HMAC_SECRET:changeme-hmac-secret-replace-in-prod}
      # 다운로드 URL TTL (초, 기본 900 = 15분)
      download-ttl-seconds: 900

logging:
  level:
    root: INFO
    kr.co.ircp.cms: DEBUG
    org.springframework.security: INFO
    org.mybatis: INFO
    org.flywaydb: INFO

# KMS 어댑터 설정 예시 (pii.keyvault.provider=aws-kms 활성화 시)
# pii:
#   keyvault:
#     provider: aws-kms
#     aws-kms:
#       key-id: arn:aws:kms:ap-northeast-2:123456789:key/your-cmk-id
#       region: ap-northeast-2
#       active-version: 1
#       endpoint-override: # LocalStack 사용 시: http://localhost:4566
#       encrypted-keys:
#         dek-v1: BASE64_KMS_ENCRYPTED_AES_KEY_V1
#         hmac: BASE64_KMS_ENCRYPTED_HMAC_KEY
