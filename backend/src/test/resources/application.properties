# SPEC-CMS-AI-003 V33 pgvector 우회 (단위 테스트 전용 — `./gradlew test`)
#
# 배경:
#   AuthorizationMatrix*IT 등 ApplicationContext 로드형 테스트(@SpringBootTest +
#   @Testcontainers)는 `postgres:16-alpine` 이미지를 직접 사용하므로 pgvector 확장이
#   존재하지 않는다. V33 마이그레이션이 `CREATE EXTENSION vector`를 호출하면
#   PSQLException 으로 ApplicationContext 로드가 실패하고 374건의 단위 테스트가
#   캐스케이드 실패한다.
#
# 처리:
#   기본 테스트 프로파일에서 Flyway 대상을 V32 까지로 제한해 pgvector 의존 마이그레이션을
#   건너뛴다. AUTHZ/Security 테스트는 V32 까지의 스키마만 사용하므로 영향 없음.
#
# 예외:
#   `@Tag("integration")` 로 표시된 진짜 통합 테스트는 `./gradlew integrationTest` 로
#   실행되며 `application-integration.yml` 의 `spring.flyway` 설정이 본 값을 덮어쓴다
#   (AbstractIntegrationTest 가 `pgvector/pgvector:pg16` 이미지를 사용해 V33 적용 가능).
spring.flyway.target=32
# Vault 비활성화 — 단위 테스트 환경에서 Vault 서버가 없으므로 컨텍스트 로딩 실패 방지
spring.cloud.vault.enabled=false
