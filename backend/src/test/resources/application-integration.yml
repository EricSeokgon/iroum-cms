spring:
  # SPEC-CMS-SECURITY-PII-FOLLOWUP-001 회귀 처리 (2026-05-11):
  # IntegrationAsyncConfig.auditExecutor가 운영 AsyncConfig.auditExecutor를 의도적으로 override
  # (PII 감사 IT 결정성을 위해 Async → Sync 변경). Spring Boot 3.5.9 기본 정책은 override 비허용
  # → integration profile에서만 명시적 허용. 운영 코드 변경 0줄.
  main:
    allow-bean-definition-overriding: true
  flyway:
    enabled: true
    baseline-on-migrate: false
    # application.properties 의 `spring.flyway.target=32` 를 덮어써서 V33 (pgvector) 까지 적용.
    # integration 프로파일은 AbstractIntegrationTest 의 `pgvector/pgvector:pg16` 이미지를 사용하므로
    # vector 확장 생성이 가능하다 (SPEC-CMS-AI-003).
    target: latest
  datasource:
    hikari:
      maximum-pool-size: 5
  mail:
    host: localhost
    port: 25

management:
  health:
    mail:
      enabled: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    cache-enabled: false
  mapper-locations:
    - classpath*:mapper/**/*.xml
    - classpath*:mybatis/mapper/**/*.xml
  type-aliases-package: kr.co.ircp.cms.domain
  type-handlers-package: kr.co.ircp.cms.domain.auth.repository.typehandler

logging:
  level:
    root: WARN
    kr.co.ircp.cms: INFO
    org.testcontainers: INFO
    org.flywaydb: INFO
    org.springframework.test: WARN
    kr.co.ircp.cms.domain.board.repository: DEBUG
    org.mybatis: DEBUG
    org.apache.ibatis: DEBUG
